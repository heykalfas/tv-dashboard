<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyline — Colorado Springs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F151C;
    --surface: #1A2028;
    --surface-alt: #212A34;
    --line: #2A323D;
    --text: #ECEFF3;
    --text-dim: #8E99A6;
    --amber: #E3A23B;
    --cyan: #4FB8C9;
    --green: #6FBF8B;
    --orange: #D9714E;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns: 280px 1fr 300px;
    grid-template-rows: 60px 1fr 138px 88px;
    grid-template-areas:
      "header header header"
      "now map side"
      "forecast forecast forecast"
      "footer footer footer";
    width:100vw; height:100vh; gap:12px; padding:16px;
  }

  /* ---------- header ---------- */
  .header{
    grid-area: header;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 4px;
  }
  .place{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px; font-weight:600; letter-spacing:0.2px;
  }
  .place span{ color:var(--text-dim); font-weight:500; font-size:16px; margin-left:8px;}
  .clock{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px; font-weight:600; color:var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .clock .date{
    color:var(--text-dim); font-weight:500; font-size:14px; margin-right:12px;
    font-family:'Inter',sans-serif;
  }

  /* ---------- panel base ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    display:flex; flex-direction:column;
    min-height:0;
  }
  .panel h2{
    margin:0 0 14px 0;
    font-size:13px; font-weight:500; color:var(--text-dim);
    letter-spacing:0.3px;
  }

  /* ---------- now card ---------- */
  .now{ grid-area: now; justify-content:flex-start; }
  .now .temp{
    font-family:'Space Grotesk',sans-serif;
    font-size:76px; font-weight:700; line-height:1;
    margin-bottom:4px;
  }
  .now .cond{ font-size:16px; color:var(--text); margin-bottom:18px; }
  .now .row{
    display:flex; justify-content:space-between;
    padding:9px 0; border-top:1px solid var(--line);
    font-size:14px;
  }
  .now .row:first-of-type{ border-top:1px solid var(--line); }
  .now .row .k{ color:var(--text-dim); }
  .now .row .v{ font-weight:500; }
  .now .updated{ margin-top:auto; padding-top:14px; font-size:11px; color:var(--text-dim); }

  /* ---------- map panel ---------- */
  .mapwrap{ grid-area: map; padding:0; overflow:hidden; position:relative; }
  .maptop{
    position:absolute; top:14px; left:14px; z-index:500;
    display:flex; gap:8px;
  }
  .toggle{
    background:rgba(15,21,28,0.85);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:13px; font-weight:500;
    padding:7px 14px; border-radius:20px;
    cursor:pointer; backdrop-filter: blur(4px);
    transition: background 0.15s, color 0.15s;
  }
  .toggle.active{ background:var(--amber); color:#241704; border-color:var(--amber); }
  .toggle.active.traffic{ background:var(--cyan); color:#08292d; border-color:var(--cyan); }
  #map{ width:100%; height:100%; background:#0B1015; }
  .maplegend{
    position:absolute; bottom:14px; left:14px; z-index:500;
    background:rgba(15,21,28,0.85); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:12px; color:var(--text-dim);
    backdrop-filter: blur(4px);
  }
  .flightlist{
    position:absolute; top:14px; right:14px; z-index:500;
    width:230px; max-height:calc(100% - 28px);
    background:rgba(15,21,28,0.9); border:1px solid var(--line);
    border-radius:8px; overflow-y:auto; display:none;
  }
  .flightlist.show{ display:block; }
  .flightlist .flrow{
    padding:9px 12px; border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .flightlist .flrow:last-child{ border-bottom:none; }
  .flightlist .flrow .cs{ color:var(--cyan); font-weight:500; }
  .flightlist .flrow .meta{ color:var(--text-dim); font-size:11px; margin-top:2px; }
  .flightlist .flhead{
    padding:9px 12px; font-family:'Inter',sans-serif; font-size:11px;
    color:var(--text-dim); border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(15,21,28,0.95);
  }

  /* ---------- side stats ---------- */
  .side{ grid-area: side; display:flex; flex-direction:column; gap:14px; }
  .stat{ flex:1; }
  .stat .big{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:34px; display:flex; align-items:baseline; gap:8px;
  }
  .stat .big .unit{ font-size:15px; font-weight:500; color:var(--text-dim); }
  .stat .tag{
    display:inline-block; margin-top:8px; padding:3px 10px;
    border-radius:20px; font-size:12px; font-weight:500;
  }
  .bar{ height:5px; border-radius:3px; background:var(--surface-alt); margin-top:12px; overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:3px; }
  .compass{
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); position:relative; flex-shrink:0;
  }
  .compass i{
    position:absolute; left:50%; top:50%; width:2px; height:13px;
    background:var(--cyan); transform-origin: bottom center;
    margin-left:-1px; margin-top:-13px; border-radius:1px;
  }
  .windrow{ display:flex; align-items:center; gap:14px; }

  /* ---------- forecast panel ---------- */
  .forecast{ grid-area: forecast; flex-direction:row; gap:0; padding:16px 0; }
  .forecast .hourly{
    flex:1.7; display:flex; gap:4px; overflow-x:auto;
    padding:0 18px; border-right:1px solid var(--line);
  }
  .forecast .hourly::-webkit-scrollbar{ height:0; }
  .hchip{
    flex:0 0 auto; width:58px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .hchip .hr{ font-size:12px; color:var(--text-dim); }
  .hchip .hc{ font-size:16px; }
  .hchip .ht{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; }
  .forecast .daily{
    flex:1; display:flex; gap:16px; overflow-x:auto;
    padding:0 18px; align-items:center;
  }
  .forecast .daily::-webkit-scrollbar{ height:0; }
  .dchip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; width:56px;
  }
  .dchip .dd{ font-size:12px; color:var(--text-dim); }
  .dchip .dc{ font-size:16px; }
  .dchip .dt{ font-size:13px; font-weight:500; white-space:nowrap; }
  .dchip .dt .lo{ color:var(--text-dim); }

  /* ---------- footer / music ---------- */
  .footer{
    grid-area: footer;
    display:flex; align-items:center; gap:14px;
    padding:0 18px;
  }
  .footer .ficon{
    font-size:20px; color:var(--green); flex-shrink:0;
  }
  .footer iframe{ border-radius:8px; flex:1; height:80px; }
  .plbtns{ display:flex; gap:8px; flex-shrink:0; }
  .plbtn{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    font-family:'Inter',sans-serif; font-size:12px; font-weight:500;
    padding:7px 12px; border-radius:20px; cursor:pointer;
  }
  .plbtn.active{ background:var(--green); color:#0c2116; border-color:var(--green); }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="place">Colorado Springs, CO 80924</div>
    <div class="clock"><span class="date" id="date"></span><span id="time">--:--</span></div>
  </div>

  <div class="panel now">
    <h2>Right now</h2>
    <div class="temp" id="temp">--°</div>
    <div class="cond" id="cond">Loading conditions…</div>
    <div class="row"><span class="k">Feels like</span><span class="v" id="feels">--</span></div>
    <div class="row"><span class="k">Humidity</span><span class="v" id="humidity">--</span></div>
    <div class="row"><span class="k">Wind gusts</span><span class="v" id="gusts">--</span></div>
    <div class="updated" id="updated">Updating…</div>
  </div>

  <div class="panel mapwrap">
    <div class="maptop">
      <div class="toggle active" id="btn-radar" onclick="setMode('radar')">Radar</div>
      <div class="toggle traffic" id="btn-traffic" onclick="setMode('traffic')">Air Traffic</div>
    </div>
    <div id="map"></div>
    <div class="maplegend" id="legend">Precipitation radar · last hour</div>
    <div class="flightlist" id="flightlist">
      <div class="flhead">Flights nearby</div>
      <div id="flightrows"></div>
    </div>
  </div>

  <div class="side">
    <div class="panel stat">
      <h2>Wind</h2>
      <div class="windrow">
        <div class="compass"><i id="windarrow"></i></div>
        <div>
          <div class="big"><span id="windspeed">--</span><span class="unit">mph</span></div>
          <div style="color:var(--text-dim); font-size:13px; margin-top:2px;" id="winddir">--</div>
        </div>
      </div>
    </div>
    <div class="panel stat">
      <h2>UV index</h2>
      <div class="big"><span id="uv">--</span></div>
      <span class="tag" id="uvtag">--</span>
      <div class="bar"><i id="uvbar" style="width:0%; background:var(--green);"></i></div>
    </div>
    <div class="panel stat">
      <h2>Air quality</h2>
      <div class="big"><span id="aqi">--</span><span class="unit">US AQI</span></div>
      <span class="tag" id="aqitag">--</span>
      <div class="bar"><i id="aqibar" style="width:0%; background:var(--green);"></i></div>
    </div>
  </div>

  <div class="panel forecast">
    <div class="hourly" id="hourly"></div>
    <div class="daily" id="daily"></div>
  </div>

  <div class="panel footer">
    <div class="ficon">♪</div>
    <iframe id="spotify-frame" src="https://open.spotify.com/embed/playlist/7w4hFg3PuhhSUH42ypv2eS?utm_source=generator&theme=0"
      frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    <div class="plbtns">
      <button class="plbtn active" id="pl-1" onclick="setPlaylist(1)">Playlist 1</button>
      <button class="plbtn" id="pl-2" onclick="setPlaylist(2)">Playlist 2</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const LAT = 38.9676, LON = -104.7211;

  // ---------------- clock ----------------
  function tick(){
    const now = new Date();
    document.getElementById('time').textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    document.getElementById('date').textContent = now.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'});
  }
  tick(); setInterval(tick, 1000);

  // ---------------- playlists ----------------
  const playlists = {
    1: "7w4hFg3PuhhSUH42ypv2eS",
    2: "3C64V048fGyQfCjmu9TIGA"
  };
  function setPlaylist(n){
    document.getElementById('spotify-frame').src = `https://open.spotify.com/embed/playlist/${playlists[n]}?utm_source=generator&theme=0`;
    document.getElementById('pl-1').classList.toggle('active', n===1);
    document.getElementById('pl-2').classList.toggle('active', n===2);
  }

  // ---------------- weather ----------------
  const weatherCodes = {
    0:"Clear sky",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",
    45:"Fog",48:"Freezing fog",
    51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
    56:"Freezing drizzle",57:"Freezing drizzle",
    61:"Light rain",63:"Rain",65:"Heavy rain",
    66:"Freezing rain",67:"Freezing rain",
    71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",
    80:"Light showers",81:"Showers",82:"Violent showers",
    85:"Snow showers",86:"Heavy snow showers",
    95:"Thunderstorm",96:"Thunderstorm w/ hail",99:"Severe thunderstorm"
  };
  function compass(deg){
    const dirs=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return dirs[Math.round(deg/22.5)%16];
  }

  const weatherIcons = {
    0:"☀️",1:"🌤️",2:"⛅",3:"☁️",
    45:"🌫️",48:"🌫️",
    51:"🌦️",53:"🌦️",55:"🌧️",56:"🌧️",57:"🌧️",
    61:"🌧️",63:"🌧️",65:"🌧️",66:"🌨️",67:"🌨️",
    71:"🌨️",73:"🌨️",75:"❄️",77:"❄️",
    80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"❄️",
    95:"⛈️",96:"⛈️",99:"⛈️"
  };

  async function loadWeather(){
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,weather_code&daily=uv_index_max,weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
      const res = await fetch(url);
      const d = await res.json();
      const c = d.current;
      document.getElementById('temp').textContent = Math.round(c.temperature_2m) + '°';
      document.getElementById('cond').textContent = weatherCodes[c.weather_code] || "—";
      document.getElementById('feels').textContent = Math.round(c.apparent_temperature) + '°F';
      document.getElementById('humidity').textContent = Math.round(c.relative_humidity_2m) + '%';
      document.getElementById('gusts').textContent = Math.round(c.wind_gusts_10m) + ' mph';
      document.getElementById('windspeed').textContent = Math.round(c.wind_speed_10m);
      document.getElementById('winddir').textContent = compass(c.wind_direction_10m) + ' · ' + Math.round(c.wind_direction_10m) + '°';
      document.getElementById('windarrow').style.transform = `rotate(${c.wind_direction_10m}deg)`;
      document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

      const uv = d.daily.uv_index_max[0];
      document.getElementById('uv').textContent = uv.toFixed(1);
      let uvLabel="Low", uvColor="var(--green)";
      if(uv>=11){uvLabel="Extreme"; uvColor="var(--orange)";}
      else if(uv>=8){uvLabel="Very high"; uvColor="var(--orange)";}
      else if(uv>=6){uvLabel="High"; uvColor="var(--amber)";}
      else if(uv>=3){uvLabel="Moderate"; uvColor="var(--amber)";}
      const uvtag = document.getElementById('uvtag');
      uvtag.textContent = uvLabel;
      uvtag.style.background = uvColor; uvtag.style.color = "#1a1204";
      document.getElementById('uvbar').style.width = Math.min(uv/11*100,100)+'%';
      document.getElementById('uvbar').style.background = uvColor;

      // 24-hour strip
      const startIdx = d.hourly.time.findIndex(t => t >= c.time);
      const hourly = document.getElementById('hourly');
      hourly.innerHTML = '';
      d.hourly.time.slice(startIdx, startIdx+24).forEach((t,i)=>{
        const hr = new Date(t).toLocaleTimeString([], {hour:'numeric'});
        const temp = Math.round(d.hourly.temperature_2m[startIdx+i]);
        const icon = weatherIcons[d.hourly.weather_code[startIdx+i]] || "•";
        const chip = document.createElement('div');
        chip.className = 'hchip';
        chip.innerHTML = `<div class="hr">${i===0?'Now':hr}</div><div class="hc">${icon}</div><div class="ht">${temp}°</div>`;
        hourly.appendChild(chip);
      });

      // 7-day strip
      const daily = document.getElementById('daily');
      daily.innerHTML = '';
      d.daily.time.forEach((t,i)=>{
        const day = i===0 ? 'Today' : new Date(t+'T12:00').toLocaleDateString([], {weekday:'short'});
        const icon = weatherIcons[d.daily.weather_code[i]] || "•";
        const hi = Math.round(d.daily.temperature_2m_max[i]);
        const lo = Math.round(d.daily.temperature_2m_min[i]);
        const chip = document.createElement('div');
        chip.className = 'dchip';
        chip.innerHTML = `<div class="dd">${day}</div><div class="dc">${icon}</div><div class="dt">${hi}° <span class="lo">${lo}°</span></div>`;
        daily.appendChild(chip);
      });
    }catch(e){
      document.getElementById('cond').textContent = "Weather unavailable";
    }
  }

  async function loadAirQuality(){
    try{
      const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi&timezone=auto`;
      const res = await fetch(url);
      const d = await res.json();
      const aqi = Math.round(d.current.us_aqi);
      document.getElementById('aqi').textContent = aqi;
      let label="Good", color="var(--green)";
      if(aqi>300){label="Hazardous"; color="var(--orange)";}
      else if(aqi>200){label="Very unhealthy"; color="var(--orange)";}
      else if(aqi>150){label="Unhealthy"; color="var(--orange)";}
      else if(aqi>100){label="Sensitive groups"; color="var(--amber)";}
      else if(aqi>50){label="Moderate"; color="var(--amber)";}
      const tag = document.getElementById('aqitag');
      tag.textContent = label;
      tag.style.background = color; tag.style.color = "#1a1204";
      document.getElementById('aqibar').style.width = Math.min(aqi/300*100,100)+'%';
      document.getElementById('aqibar').style.background = color;
    }catch(e){
      document.getElementById('aqitag').textContent = "Unavailable";
    }
  }

  loadWeather(); loadAirQuality();
  setInterval(loadWeather, 10*60*1000);
  setInterval(loadAirQuality, 10*60*1000);

  // ---------------- map ----------------
  const map = L.map('map', {zoomControl:false, attributionControl:false, minZoom:3, maxZoom:11}).setView([LAT, LON], 8);
  L.tileLayer('https://basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}.png', {
    maxZoom: 11, minZoom: 3
  }).addTo(map);
  L.circleMarker([LAT, LON], {radius:5, color:'#E3A23B', fillColor:'#E3A23B', fillOpacity:1, weight:2}).addTo(map);

  let mode = 'radar';
  let radarLayers = [];
  let radarFrameIdx = 0;
  let radarTimer = null;
  let trafficMarkers = L.layerGroup().addTo(map);
  let trafficTimer = null;

  async function setupRadar(){
    try{
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const d = await res.json();
      const frames = d.radar.past.slice(-6);
      radarLayers.forEach(l=>map.removeLayer(l));
      radarLayers = frames.map(f =>
        L.tileLayer(`${d.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, {opacity:0, zIndex:400})
      );
      radarLayers.forEach(l=>l.addTo(map));
      radarFrameIdx = radarLayers.length-1;
      showRadarFrame();
      if(radarTimer) clearInterval(radarTimer);
      radarTimer = setInterval(()=>{
        radarFrameIdx = (radarFrameIdx+1) % radarLayers.length;
        showRadarFrame();
      }, 600);
    }catch(e){
      document.getElementById('legend').textContent = 'Radar unavailable';
    }
  }
  function showRadarFrame(){
    radarLayers.forEach((l,i)=> l.setOpacity(i===radarFrameIdx && mode==='radar' ? 0.65 : 0));
  }

  async function loadTraffic(){
    try{
      const d = 3.5; // degrees ~ regional box
      const url = `https://opensky-network.org/api/states/all?lamin=${LAT-d}&lomin=${LON-d*1.3}&lamax=${LAT+d}&lomax=${LON+d*1.3}`;
      const res = await fetch(url);
      const data = await res.json();
      trafficMarkers.clearLayers();
      const rows = document.getElementById('flightrows');
      rows.innerHTML = '';
      if(!data.states){ return; }
      const planes = data.states
        .filter(s => s[5] && s[6] && s[7] != null)
        .map(s => ({
          callsign: (s[1]||'').trim() || '—',
          lon: s[5], lat: s[6], alt: s[7], vel: s[9], track: s[10]||0,
          dist: Math.hypot(s[6]-LAT, s[5]-LON)
        }))
        .sort((a,b)=>a.dist-b.dist)
        .slice(0, 40);

      planes.forEach(p=>{
        const icon = L.divIcon({
          className:'',
          html:`<div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #4FB8C9;transform:rotate(${p.track}deg);filter:drop-shadow(0 0 3px rgba(79,184,201,0.7));"></div>`,
          iconSize:[12,12], iconAnchor:[6,6]
        });
        L.marker([p.lat, p.lon], {icon})
          .bindPopup(`<b>${p.callsign}</b><br>Altitude: ${Math.round(p.alt*3.281)} ft<br>Speed: ${p.vel?Math.round(p.vel*2.237):'—'} mph`)
          .addTo(trafficMarkers);
      });

      planes.slice(0,15).forEach(p=>{
        const div = document.createElement('div');
        div.className = 'flrow';
        div.innerHTML = `<div class="cs">${p.callsign}</div><div class="meta">${Math.round(p.alt*3.281).toLocaleString()} ft · ${p.vel?Math.round(p.vel*2.237):'—'} mph</div>`;
        rows.appendChild(div);
      });
      if(planes.length===0){
        rows.innerHTML = '<div class="flrow meta">No flights detected nearby</div>';
      }
    }catch(e){
      document.getElementById('flightrows').innerHTML = '<div class="flrow meta">Flight data unavailable</div>';
    }
  }

  function setMode(m){
    mode = m;
    document.getElementById('btn-radar').classList.toggle('active', m==='radar');
    document.getElementById('btn-traffic').classList.toggle('active', m==='traffic');
    document.getElementById('flightlist').classList.toggle('show', m==='traffic');
    document.getElementById('legend').style.display = m==='radar' ? 'block' : 'none';
    showRadarFrame();
    if(m==='traffic'){
      loadTraffic();
      if(trafficTimer) clearInterval(trafficTimer);
      trafficTimer = setInterval(loadTraffic, 30000);
    } else {
      if(trafficTimer) clearInterval(trafficTimer);
    }
  }

  setupRadar();
  setInterval(setupRadar, 10*60*1000);
</script>

</body>
</html>
